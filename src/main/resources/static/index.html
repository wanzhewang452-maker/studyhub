
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyHub - 学习管理系统</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
            background: #f4f6fa;
            color: #243047;
        }

        button, input, select { font: inherit; }
        button { cursor: pointer; }

        .hidden { display: none !important; }

        header {
            background: #17243a;
            color: white;
            padding: 17px 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 23px;
            font-weight: 700;
            letter-spacing: .5px;
        }

        .logo span { color: #65a8ff; }

        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 3px 15px rgba(0,0,0,.035);
        }

        .login-box {
            max-width: 430px;
            margin: 90px auto;
        }

        h2 { margin-top: 0; }
        .muted { color: #8b95a7; font-size: 13px; }

        input, select {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid #dce2ec;
            border-radius: 7px;
            outline: none;
            margin-top: 7px;
            background: white;
        }

        input:focus, select:focus {
            border-color: #4388ed;
        }

        .field { margin: 17px 0; }

        label {
            font-size: 13px;
            font-weight: 600;
        }

        .btn {
            border: 0;
            padding: 10px 17px;
            border-radius: 7px;
            background: #377fe5;
            color: white;
        }

        .btn:hover { background: #246bd0; }

        .btn:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #edf1f7;
            color: #35445b;
        }

        .btn-danger {
            background: #fff0ef;
            color: #d34a42;
        }

        .btn-success { background: #199c70; }

        .btn-small {
            padding: 7px 11px;
            font-size: 12px;
        }

        .full { width: 100%; }

        .topline {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 17px;
            margin: 25px 0;
        }

        .stat {
            background: white;
            border-radius: 12px;
            padding: 20px;
        }

        .stat strong {
            display: block;
            font-size: 29px;
            margin-top: 10px;
        }

        .stat small { color: #8792a5; }
        .blue { color: #377fe5; }
        .green { color: #199c70; }
        .orange { color: #e59a35; }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin: 20px 0;
        }

        .filters {
            display: flex;
            gap: 8px;
        }

        .filter {
            border: 1px solid #e0e5ed;
            background: white;
            border-radius: 7px;
            padding: 8px 15px;
            color: #536176;
        }

        .filter.active {
            background: #eaf2ff;
            color: #377fe5;
            border-color: #c8dcff;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 11px;
        }

        .task {
            display: flex;
            align-items: center;
            gap: 13px;
            border: 1px solid #e9edf3;
            border-radius: 9px;
            padding: 16px;
            background: white;
        }

        .task-title {
            flex: 1;
            min-width: 0;
            overflow-wrap: anywhere;
            font-weight: 600;
        }

        .task-title.done {
            text-decoration: line-through;
            color: #a0a8b5;
        }

        .task-meta {
            font-size: 12px;
            color: #9aa3b1;
            margin-top: 5px;
        }

        .task-actions {
            display: flex;
            gap: 7px;
        }

        .status {
            font-size: 11px;
            border-radius: 20px;
            padding: 4px 9px;
            background: #fff5e5;
            color: #c78a26;
        }

        .status.done {
            background: #e8f7f0;
            color: #199c70;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 24px;
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(15,25,42,.48);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 10;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 430px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 22px;
        }

        .notice {
            padding: 12px 15px;
            border-radius: 7px;
            margin-bottom: 17px;
            font-size: 13px;
        }

        .notice.error {
            color: #bb4038;
            background: #fff0ee;
        }

        .notice.info {
            color: #326bb2;
            background: #edf5ff;
        }

        .notice.success {
            color: #16835f;
            background: #e9f8f1;
        }

        .config {
            margin-bottom: 18px;
        }

        .config summary {
            cursor: pointer;
            font-size: 13px;
            color: #64738a;
        }

        .config-content {
            display: flex;
            align-items: end;
            gap: 12px;
            margin-top: 12px;
        }

        .config-content .field { flex: 1; margin: 0; }

        .empty {
            text-align: center;
            color: #9aa3b1;
            padding: 55px 10px;
        }

        footer {
            text-align: center;
            color: #a0a9b6;
            padding: 30px;
            font-size: 12px;
        }

        @media(max-width:650px) {
            .stats { gap: 8px; }
            .stat { padding: 13px; }
            .stat strong { font-size: 23px; }
            .task { flex-wrap: wrap; }
            .task-actions { width: 100%; }
            .task-actions button { flex: 1; }
            .config-content { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">Study<span>Hub</span></div>
    <div id="headerUser" class="muted" style="color:#cbd5e1">
        未登录
    </div>
</header>

<main class="container">

    <!-- 登录页面 -->
    <section id="loginPage" class="login-box card">
        <h2>欢迎回来 👋</h2>
        <p class="muted">登录 StudyHub，管理你的学习任务。</p>

        <div id="loginNotice"></div>

        <div class="field">
            <label>用户名</label>
            <input id="username" placeholder="请输入用户名">
        </div>

        <div class="field">
            <label>密码</label>
            <input id="password" type="password"
                   placeholder="请输入密码">
        </div>

        <button class="btn full" id="loginBtn" onclick="login()">
            登录
        </button>

        <p class="muted" style="margin-top:20px">
            当前使用真实后端 API，不使用模拟登录。
        </p>
    </section>

    <!-- 主页面 -->
    <section id="mainPage" class="hidden">

        <div class="topline">
            <div>
                <h2>我的学习空间</h2>
                <p class="muted">今天也要向目标迈进一步。</p>
            </div>

            <button class="btn btn-secondary"
                    onclick="logout()">退出登录</button>
        </div>

        <div id="mainNotice"></div>

        <!-- API 配置 -->
        <details class="config">
            <summary>API 连接配置</summary>
            <div class="config-content">
                <div class="field">
                    <label>后端 API 地址</label>
                    <input id="apiBase" value="http://localhost:8080">
                </div>
                <button class="btn btn-secondary"
                        onclick="saveApi()">保存地址</button>
            </div>
        </details>

        <!-- 统计卡片 -->
        <div class="stats">
            <div class="stat">
                <small>本页任务</small>
                <strong class="blue" id="totalCount">0</strong>
            </div>

            <div class="stat">
                <small>已完成</small>
                <strong class="green" id="doneCount">0</strong>
            </div>

            <div class="stat">
                <small>待完成</small>
                <strong class="orange" id="pendingCount">0</strong>
            </div>
        </div>

        <!-- 任务管理 -->
        <div class="card">
            <div class="topline">
                <div>
                    <h2>学习任务</h2>
                    <p class="muted">管理你的每日学习计划。</p>
                </div>

                <button class="btn" onclick="openModal()">
                    + 新建任务
                </button>
            </div>

            <div class="toolbar">
                <div class="filters">
                    <button class="filter active"
                            data-filter="all"
                            onclick="changeFilter('all')">全部</button>
                    <button class="filter"
                            data-filter="false"
                            onclick="changeFilter('false')">未完成</button>
                    <button class="filter"
                            data-filter="true"
                            onclick="changeFilter('true')">已完成</button>
                </div>

                <button class="btn btn-secondary btn-small"
                        onclick="loadTasks()">刷新列表</button>
            </div>

            <div id="taskList" class="task-list">
                <div class="empty">请先登录并加载任务。</div>
            </div>

            <div class="pagination">
                <button class="btn btn-secondary btn-small"
                        id="prevBtn" onclick="changePage(-1)">上一页</button>

                <span class="muted" id="pageInfo">第 1 页</span>

                <button class="btn btn-secondary btn-small"
                        id="nextBtn" onclick="changePage(1)">下一页</button>
            </div>
        </div>
    </section>

</main>

<footer>
    StudyHub · Personal Learning Management System
</footer>

<!-- 新增/编辑任务弹窗 -->
<div id="taskModal" class="modal hidden">
    <div class="modal-content">
        <h2 id="modalTitle">新建任务</h2>

        <div class="field">
            <label>任务标题</label>
            <input id="taskTitle"
                   maxlength="200"
                   placeholder="例如：学习 Spring Boot">
        </div>

        <div class="field hidden" id="doneField">
            <label>完成状态</label>
            <select id="taskDone">
                <option value="false">未完成</option>
                <option value="true">已完成</option>
            </select>
        </div>

        <div id="modalNotice"></div>

        <div class="modal-actions">
            <button class="btn btn-secondary"
                    onclick="closeModal()">取消</button>

            <button class="btn" id="saveTaskBtn"
                    onclick="saveTask()">保存</button>
        </div>
    </div>
</div>

<script>
    /* ==============================
       1. 全局配置
    ============================== */

    const CONFIG = {
        login: "/users/login",
        tasks: "/tasks",
        pageSize: 10
    };

    let token = localStorage.getItem("studyhub_token") || "";
    let apiBase = localStorage.getItem("studyhub_api")
        || "http://localhost:8080";

    let currentPage = 1;
    let currentFilter = "all";
    let editingId = null;
    let busy = false;

    const $ = id => document.getElementById(id);

    $("apiBase").value = apiBase;


    /* ==============================
       2. 通用提示
    ============================== */

    function notice(id, message, type = "info") {
        $(id).replaceChildren();

        if (!message) return;

        const box = document.createElement("div");
        box.className = "notice " + type;
        box.textContent = message;

        $(id).appendChild(box);
    }


    /* ==============================
       3. API 请求封装
    ============================== */

    async function apiRequest(path, options = {}) {

        const headers = {
            ...(options.headers || {})
        };

        if (token) {
            headers.Authorization = "Bearer " + token;
        }

        if (options.body !== undefined) {
            headers["Content-Type"] = "application/json";
        }

        let response;

        try {
            response = await fetch(
                apiBase.replace(/\/+$/, "") + path,
                {
                    ...options,
                    headers
                }
            );
        } catch (error) {
            throw new Error(
                "无法连接后端，请检查 Spring Boot 是否启动及 CORS 配置。"
            );
        }

        const text = await response.text();

        let result = null;

        if (text) {
            try {
                result = JSON.parse(text);
            } catch {
                throw new Error("服务器返回的不是有效 JSON。");
            }
        }

        if (response.status === 401) {
            token = "";
            localStorage.removeItem("studyhub_token");
            showLogin();
            throw new Error("登录已失效，请重新登录。");
        }

        if (!response.ok) {
            throw new Error(
                result?.message || `HTTP ${response.status}`
            );
        }

        if (result && result.code !== undefined
            && result.code !== 200) {
            throw new Error(result.message || "业务请求失败");
        }

        return result;
    }


    /* ==============================
       4. 登录
    ============================== */

    async function login() {

        const username = $("username").value.trim();
        const password = $("password").value;

        if (!username || !password) {
            notice("loginNotice", "请输入用户名和密码。", "error");
            return;
        }

        const btn = $("loginBtn");
        btn.disabled = true;
        btn.textContent = "登录中...";

        try {
            const result = await apiRequest(CONFIG.login, {
                method: "POST",
                body: JSON.stringify({ username, password })
            });

            const jwt = typeof result.data === "string"
                ? result.data
                : result.data?.token;

            if (!jwt) {
                throw new Error("登录成功，但没有获取到 JWT。");
            }

            token = jwt;

            // 教学 Demo 使用 localStorage 保存 JWT。
            localStorage.setItem("studyhub_token", token);

            showMain();
            await loadTasks();

        } catch (error) {
            notice("loginNotice", error.message, "error");
        } finally {
            btn.disabled = false;
            btn.textContent = "登录";
        }
    }


    /* ==============================
       5. 登录状态切换
    ============================== */

    function showLogin() {
        $("loginPage").classList.remove("hidden");
        $("mainPage").classList.add("hidden");
        $("headerUser").textContent = "未登录";
    }

    function showMain() {
        $("loginPage").classList.add("hidden");
        $("mainPage").classList.remove("hidden");

        $("headerUser").textContent = "已登录";
    }

    function logout() {
        token = "";
        localStorage.removeItem("studyhub_token");
        showLogin();
        notice("loginNotice", "已退出登录。", "success");
    }


    /* ==============================
       6. API 地址配置
    ============================== */

    function saveApi() {
        const value = $("apiBase").value.trim();

        if (!/^https?:\/\/[^/]+/i.test(value)) {
            notice("mainNotice", "请输入有效的 HTTP API 地址。", "error");
            return;
        }

        apiBase = value.replace(/\/+$/, "");
        localStorage.setItem("studyhub_api", apiBase);

        notice("mainNotice", "API 地址已保存。", "success");
    }


    /* ==============================
       7. 解析任务列表响应
    ============================== */

    // 兼容常见分页结构。
    // 如果你的 PageBean 字段名称不同，
    // 后续只需要调整这个函数。

    function extractTasks(result) {

        const data = result?.data;

        if (Array.isArray(data)) {
            return {
                items: data,
                total: data.length,
                totalPages: 1
            };
        }

        if (!data || typeof data !== "object") {
            return { items: [], total: 0, totalPages: 1 };
        }

        const items =
            data.records ||
            data.list ||
            data.items ||
            data.content ||
            data.tasks ||
            [];

        if (!Array.isArray(items)) {
            throw new Error(
                "无法识别任务列表结构，请检查后端 PageBean 返回字段。"
            );
        }

        const total = Number(data.total ?? items.length);

        const totalPages = Number(
            data.totalPages ??
            data.totalPagesCount ??
            Math.max(1, Math.ceil(total / CONFIG.pageSize))
        );

        return { items, total, totalPages };
    }


    /* ==============================
       8. 查询任务列表
    ============================== */

    async function loadTasks() {

        if (!token || busy) return;

        busy = true;

        $("taskList").innerHTML =
            '<div class="empty">正在加载任务...</div>';

        try {

            const params = new URLSearchParams({
                page: currentPage,
                pageSize: CONFIG.pageSize
            });

            if (currentFilter !== "all") {
                params.set("done", currentFilter);
            }

            const result = await apiRequest(
                CONFIG.tasks + "?" + params.toString()
            );

            const page = extractTasks(result);

            renderTasks(page.items, page);

            notice("mainNotice", "");

        } catch (error) {

            $("taskList").textContent = error.message;

            notice("mainNotice", error.message, "error");

        } finally {
            busy = false;
        }
    }


    /* ==============================
       9. 渲染任务列表
    ============================== */

    function normalizeDone(value) {
        return value === true ||
            value === 1 ||
            value === "1" ||
            value === "true";
    }

    function renderTasks(tasks, page) {

        $("taskList").replaceChildren();

        const doneCount = tasks.filter(
            task => normalizeDone(task.done)
        ).length;

        $("totalCount").textContent = page.total;
        $("doneCount").textContent = doneCount;
        $("pendingCount").textContent =
            tasks.length - doneCount;

        $("pageInfo").textContent =
            `第 ${currentPage} 页 / 共 ${page.totalPages} 页`;

        $("prevBtn").disabled = currentPage <= 1;
        $("nextBtn").disabled =
            currentPage >= page.totalPages;

        if (!tasks.length) {
            const empty = document.createElement("div");
            empty.className = "empty";
            empty.textContent = "暂无任务，点击右上角创建一个吧。";
            $("taskList").appendChild(empty);
            return;
        }

        tasks.forEach(task => {

            const isDone = normalizeDone(task.done);

            const row = document.createElement("div");
            row.className = "task";

            const icon = document.createElement("span");
            icon.textContent = isDone ? "✓" : "○";
            icon.style.color = isDone ? "#199c70" : "#9aa3b1";
            icon.style.fontSize = "21px";

            const content = document.createElement("div");
            content.className = "task-title" +
                (isDone ? " done" : "");

            const title = document.createElement("div");
            title.textContent = task.title || "未命名任务";

            const meta = document.createElement("div");
            meta.className = "task-meta";
            meta.textContent =
                "ID: " + task.id +
                (task.createdAt || task.created_at
                    ? " · 创建时间: " +
                    (task.createdAt || task.created_at)
                    : "");

            content.append(title, meta);

            const status = document.createElement("span");
            status.className = "status" +
                (isDone ? " done" : "");

            status.textContent = isDone ? "已完成" : "待完成";

            const actions = document.createElement("div");
            actions.className = "task-actions";

            const edit = document.createElement("button");
            edit.className = "btn btn-secondary btn-small";
            edit.textContent = "编辑";
            edit.onclick = () => openModal(task);

            const remove = document.createElement("button");
            remove.className = "btn btn-danger btn-small";
            remove.textContent = "删除";
            remove.onclick = () => deleteTask(task.id);

            actions.append(edit, remove);

            row.append(icon, content, status, actions);

            $("taskList").appendChild(row);
        });
    }


    /* ==============================
       10. 筛选和分页
    ============================== */

    function changeFilter(value) {

        currentFilter = value;
        currentPage = 1;

        document.querySelectorAll(".filter").forEach(btn => {
            btn.classList.toggle(
                "active",
                btn.dataset.filter === value
            );
        });

        loadTasks();
    }

    function changePage(delta) {

        currentPage = Math.max(1, currentPage + delta);
        loadTasks();
    }


    /* ==============================
       11. 新建 / 编辑弹窗
    ============================== */

    function openModal(task = null) {

        editingId = task ? task.id : null;

        $("modalTitle").textContent =
            task ? "修改任务" : "新建任务";

        $("taskTitle").value = task ? task.title : "";

        $("doneField").classList.toggle(
            "hidden", !task
        );

        $("taskDone").value =
            task && normalizeDone(task.done)
                ? "true" : "false";

        notice("modalNotice", "");

        $("taskModal").classList.remove("hidden");

        $("taskTitle").focus();
    }

    function closeModal() {
        $("taskModal").classList.add("hidden");
    }


    /* ==============================
       12. 保存任务
    ============================== */

    async function saveTask() {

        const title = $("taskTitle").value.trim();

        if (!title) {
            notice("modalNotice", "任务标题不能为空。", "error");
            return;
        }

        if (title.length > 200) {
            notice("modalNotice", "标题最多 200 个字符。", "error");
            return;
        }

        const editing = editingId !== null;

        const body = editing
            ? {
                title,
                done: $("taskDone").value === "true"
            }
            : { title };

        const btn = $("saveTaskBtn");
        btn.disabled = true;
        btn.textContent = "保存中...";

        try {

            const path = editing
                ? CONFIG.tasks + "/" + encodeURIComponent(editingId)
                : CONFIG.tasks;

            await apiRequest(path, {
                method: editing ? "PUT" : "POST",
                body: JSON.stringify(body)
            });

            closeModal();

            notice(
                "mainNotice",
                editing ? "任务修改成功。" : "任务创建成功。",
                "success"
            );

            await loadTasks();

        } catch (error) {

            notice("modalNotice", error.message, "error");

        } finally {
            btn.disabled = false;
            btn.textContent = "保存";
        }
    }


    /* ==============================
       13. 删除任务
    ============================== */

    async function deleteTask(id) {

        if (!confirm("确定要删除这个任务吗？")) {
            return;
        }

        try {

            await apiRequest(
                CONFIG.tasks + "/" + encodeURIComponent(id),
                { method: "DELETE" }
            );

            notice("mainNotice", "任务删除成功。", "success");

            await loadTasks();

        } catch (error) {

            notice("mainNotice", error.message, "error");
        }
    }


    /* ==============================
       14. 页面初始化
    ============================== */

    async function init() {

        $("apiBase").value = apiBase;

        if (token) {
            showMain();
            await loadTasks();
        } else {
            showLogin();
        }
    }

    $("password").addEventListener("keydown", event => {
        if (event.key === "Enter") login();
    });

    $("taskTitle").addEventListener("keydown", event => {
        if (event.key === "Enter") saveTask();
    });

    init();

</script>
</body>
</html>
