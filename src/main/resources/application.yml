spring:
  application:
    name: StudyHub

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/studyhub
    username: root
    password: 1234

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
server:
  port: 8080
jwt:
  secret-base64: ${JWT_SECRET_BASE64}
  expiration: 1800000

pagehelper:
  helper-dialect: mysql
  reasonable: false

